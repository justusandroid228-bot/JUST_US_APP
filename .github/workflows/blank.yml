name: Android Build Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # ၁။ Repository ကို Checkout လုပ်ခြင်း
      - name: Checkout Code
        uses: actions/checkout@v4

      # ၂။ Node.js ထည့်သွင်းခြင်း (v5 သို့ မြှင့်ထားသည်)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ၃။ Java JDK ထည့်သွင်းခြင်း (Warning တက်နေသည့် v4 မှ v5 သို့ ပြောင်းထားသည်)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ၄။ Android SDK ထည့်သွင်းခြင်း
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ၅။ Gradle Build လုပ်ရန် Permission ပေးခြင်း
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ၆။ Debug APK တည်ဆောက်ခြင်း
      - name: Build Android APK
        run: ./gradlew assembleDebug

      # ၇။ ထွက်လာတဲ့ APK ဖိုင်ကို Artifact အဖြစ် သိမ်းဆည်းပေးခြင်း (Download ဆွဲရန်)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
