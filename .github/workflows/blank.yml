name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Published JustUs URL"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAP_SERVER_URL: ${{ inputs.app_url || vars.JUSTUS_APP_URL }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    
    steps:
      - uses: actions/checkout@v5

      - name: Check app URL
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::error::Set the JUSTUS_APP_URL repository variable."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Create Android project (If not exists)
        run: |
          if [ ! -d "android" ]; then 
            echo "Android folder not found, creating..."
            npx cap add android
          fi
          
      - name: Run configure script
        run: |
          if [ -f "scripts/android/configure.mjs" ]; then
            node scripts/android/configure.mjs
          else
            echo "Configure script not found, skipping."
          fi

      - name: Generate icon and splash
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFF0F5' --splashBackgroundColor '#FFF0F5'

      - name: Sync web shell and plugins
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      # APK ဖိုင် ရှိမရှိ ရှာပြီး Log ထဲမှာ ပြပေးမယ်
      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk"

      # Build လုပ်ပြီး ထွက်လာတဲ့ Output folder တစ်ခုလုံးကို Zip အနေနဲ့ တင်ပေးလိုက်မယ်
      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: JustUs-Build-Files
          # APK ဖိုင်ရော၊ သူ့ folder ပါ အကုန်သိမ်းပေးလိုက်မယ်
          path: android/app/build/outputs/
          if-no-files-found: warn
