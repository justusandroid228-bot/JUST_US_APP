name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Published JustUs URL"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAP_SERVER_URL: ${{ inputs.app_url || vars.JUSTUS_APP_URL }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Check app URL
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::error::Set the JUSTUS_APP_URL repository variable."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # သင်က bun သုံးရင် ဒီစာကြောင်းကို ဖျက်ပါ

      # Bun မသုံးဘဲ ရိုးရိုး npm နဲ့ သုံးကြည့်ခြင်းက Error အကြီးကြီး တက်နိုင်ခြေနည်းပါတယ်
      - name: Install dependencies
        run: npm install 
        # တကယ်လို့ bun ကို သေချာသုံးချင်ရင် အပေါ်က setup-node ကို ဖျက်ပြီး 
        # ဒီနေရာမှာ - uses: oven-sh/setup-bun@v2 ထည့်ပြီး run: bun install လုပ်ပါ

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Create Android project (If not exists)
        run: |
          if [ ! -d "android" ]; then 
            echo "Android folder not found, creating..."
            npx cap add android
          fi
          
      - name: Run configure script
        run: |
          if [ -f "scripts/android/configure.mjs" ]; then
            node scripts/android/configure.mjs
          else
            echo "Configure script not found, skipping."
          fi

      - name: Generate icon and splash
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFF0F5' --splashBackgroundColor '#FFF0F5'

      - name: Sync web shell and plugins
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JustUs-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
