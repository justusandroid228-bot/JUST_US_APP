name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # ၁။ Repository ကို ယူဆောင်ခြင်း
      - name: Checkout Code
        uses: actions/checkout@v4

      # ၂။ Java JDK 17 ထည့်သွင်းခြင်း
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ၃။ Gradle ကို Run လို့ရအောင် Permission ပေးခြင်း
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ၄။ Debug APK တည်ဆောက်ခြင်း (SDK ကို အလိုအလျောက်ချိတ်ဆက်ပေးပါလိမ့်မည်)
      - name: Build Android APK
        run: ./gradlew assembleDebug

      # ၅။ ထွက်လာတဲ့ APK ဖိုင်ကို Download ဆွဲနိုင်ရန် သိမ်းဆည်းပေးခြင်း
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
