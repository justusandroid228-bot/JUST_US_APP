name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Published JustUs URL"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAP_SERVER_URL: ${{ inputs.app_url || vars.JUSTUS_APP_URL }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Check app URL
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::error::Set the JUSTUS_APP_URL repository variable."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Warning ပျောက်အောင် setup-java ကို v5 ကို ပြောင်းထားပါတယ်
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Create Android project (If not exists)
        run: |
          if [ ! -d "android" ]; then 
            echo "Android folder not found, creating..."
            npx cap add android
          fi
          
      - name: Run configure script
        run: |
          if [ -f "scripts/android/configure.mjs" ]; then
            node scripts/android/configure.mjs
          else
            echo "::warning::scripts/android/configure.mjs not found, skipping."
          fi

      - name: Generate icon and splash
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFF0F5' --splashBackgroundColor '#FFF0F5'

      - name: Sync web shell and plugins
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      # APK ဖိုင် တကယ်ထွက်မထွက် စစ်ဆေးဖို့ ထည့်ထားပါတယ်
      - name: Verify APK exists
        run: |
          ls -R android/app/build/outputs/apk/debug/ || echo "APK Folder Not Found"

      - uses: actions/upload-artifact@v4
        with:
          name: JustUs-debug-apk
          # APK ဖိုင် ရှာမတွေ့ရင် Error တက်မယ့်အစား ရှာတွေ့တဲ့ ဖိုင်အားလုံးကို ယူသွားအောင် path ကို ချဲ့ထားပါတယ်
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
